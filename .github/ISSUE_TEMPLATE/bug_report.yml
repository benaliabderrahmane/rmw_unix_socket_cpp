name: 🐛 Bug Report
description: File a bug report.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "**Required Info:**"
  - type: input
    id: generative_ai
    attributes:
      label: "Generated by Generative AI"
      description: "If this issue was generated using Generative AI, specify the tool and model used (e.g. GitHub Copilot, Claude Code)"
    validations:
      required: false
  - type: input
    id: os
    attributes:
      label: "Operating System:"
      description: |
        Please try to be specific.
        Run `uname -a` from a terminal and copy/paste its output here.
        This RMW is Linux-only (it uses `epoll`, `eventfd`, `/dev/shm` and `AF_UNIX`).
      value: |
        ```
        <PUT OS INFO HERE>
        ```
    validations:
      required: true
  - type: dropdown
    id: ros_distro
    attributes:
      label: "ROS 2 distro:"
      options:
        - jazzy
        - kilted
        - rolling
        - other (please state in Additional information)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: "rmw_unix_socket_cpp version or commit hash:"
      description: |
        The version from `package.xml`, or the commit hash you built from (`git rev-parse HEAD`).
    validations:
      required: true
  - type: input
    id: clientlib
    attributes:
      label: "Client library (if applicable):"
      description: |
        **Examples:** *rclcpp*, *rclpy*, ...
        Client libraries are the APIs that allow users to implement their ROS 2 code.
    validations:
      required: false
  - type: dropdown
    id: executor
    attributes:
      label: "Executor (if applicable):"
      description: |
        Wait-set and event delivery behaviour differs noticeably between executors.
      options:
        - SingleThreadedExecutor
        - MultiThreadedExecutor
        - StaticSingleThreadedExecutor
        - EventsExecutor
        - other / not sure
    validations:
      required: false
  - type: dropdown
    id: other_rmw
    attributes:
      label: "Does the same reproducer work with another RMW?"
      description: |
        Re-run with `RMW_IMPLEMENTATION=rmw_fastrtps_cpp` (or `rmw_cyclonedds_cpp`).
        This tells us whether the bug is specific to this RMW or lives further up the stack.
      options:
        - "Yes — it works with another RMW, so the bug looks specific to rmw_unix_socket_cpp"
        - "No — it fails with another RMW too"
        - "Not tested"
    validations:
      required: false
  - type: textarea
    id: qos
    attributes:
      label: "QoS profile (if applicable):"
      description: |
        If you use a non-default QoS profile, post it here (reliability, durability, history, depth).
        Note that some policies are unsupported — see the Limitations section of the README.
    validations:
      required: false
  - type: textarea
    id: doctor
    attributes:
      label: "'ros2 doctor --report' output"
      description: |
        It can help us knowing the details of your ROS environment.
        Please use the command `ros2 doctor --report` and copy paste its output here.
      value: |
        <details><summary>ros2 doctor --report</summary>

        ```console
        <COPY OUTPUT HERE>
        ```
        </details>
    validations:
      required: false
  - type: textarea
    id: repro
    attributes:
      label: "Steps to reproduce issue"
      description: |
        How do you trigger this bug? Please walk us through it step by step.
        Include all the commands you ran in the exact order you ran them so that anyone can reproduce the bug.
        Remember that every process that should talk to each other needs `RMW_IMPLEMENTATION=rmw_unix_socket_cpp` set.
      placeholder: |
        1.
        2.
        3.
        ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Expected behavior"
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: "Actual behavior"
      description: |
        Include any error output. If a process crashed, a backtrace is very helpful.
        Setting `RCUTILS_LOGGING_SEVERITY=DEBUG` often surfaces the relevant RMW logs.
    validations:
      required: true
  - type: textarea
    id: addinfo
    attributes:
      label: "Additional information"
      description: |
        Please note any additional information to share here.
        e.g) Is the reported bug a regression? If so, what is the last version where it still worked fine?
        How many nodes/topics does your system run, and does the problem depend on that scale?
    validations:
      required: false
