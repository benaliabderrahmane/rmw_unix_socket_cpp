name: Claude

on:
  issue_comment:
    types: [created]

jobs:
  claude:
    # "@claude ..." comments on PRs only; the action itself ignores commenters without write access.
    if: ${{ github.event.issue.pull_request && contains(github.event.comment.body, '@claude') }}
    runs-on: ubuntu-latest
    # Read-only contents: Claude can comment but never push, even on an untrusted fork PR.
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    env:
      # Keep the Claude token out of commands Claude runs, in case PR text injects instructions.
      CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: 1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Anyone can comment on a public PR; only the owner's comments reach Claude.
          include_comments_by_actor: benaliabderrahmane
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*)"
